<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiCopK Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0b;
  --charcoal:#151517;
  --surface:#1c1c1f;
  --surface-2:#232326;
  --line:#2c2c30;
  --red:#ff2340;
  --red-dim:#8f1626;
  --red-glow:rgba(255,35,64,.35);
  --text:#f3f1ef;
  --text-dim:#9a989e;
  --text-faint:#65636a;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --radius:10px;
  --radius-lg:16px;
  --sidebar-w:230px;
  --player-h:84px;
  --topbar-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--black);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--red);}
img{display:block;max-width:100%;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:8px;}
::selection{background:var(--red-dim);color:#fff;}

/* ---------- App shell ---------- */
#app-root{display:flex;min-height:100vh;padding-bottom:var(--player-h);}
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--charcoal);
  border-right:1px solid var(--line);
  padding:22px 14px;
  position:fixed;top:0;bottom:var(--player-h);left:0;
  display:flex;flex-direction:column;gap:24px;
  z-index:40;
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(145deg,var(--red),#7a0f22);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:#fff;font-size:16px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset;
}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.2px;}
.nav-group{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:8px;
  color:var(--text-dim);font-size:14px;font-weight:500;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--surface);color:var(--text);}
.nav-item.active{background:var(--surface);color:var(--text);}
.nav-item.active .nav-ic{color:var(--red);}
.nav-ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-ic svg{width:100%;height:100%;}
.sidebar-cta{margin-top:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;font-size:12.5px;color:var(--text-dim);}
.sidebar-cta b{color:var(--text);}
.upload-btn{
  margin-top:6px;width:100%;background:var(--red);color:#fff;padding:9px;border-radius:8px;font-weight:600;font-size:13px;
}
.upload-btn:hover{background:#e01c39;}

.main-col{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:var(--topbar-h);flex-shrink:0;
  display:flex;align-items:center;gap:16px;
  padding:0 28px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(10,10,11,.85);backdrop-filter:blur(10px);
  z-index:30;
}
.search-box{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:8px 14px;
}
.search-box input{background:none;border:none;padding:0;flex:1;font-size:13.5px;}
.search-box svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);position:relative;}
.icon-btn:hover{background:var(--surface);color:var(--text);}
.icon-btn svg{width:19px;height:19px;}
.badge-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--black);}
.avatar-btn{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.avatar-btn img{width:100%;height:100%;object-fit:cover;}

.content{flex:1;padding:28px;max-width:1400px;width:100%;}
.content.narrow{max-width:920px;}

h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.section-head h2{font-size:19px;}
.section-head a{font-size:12.5px;color:var(--text-dim);font-weight:600;}
.section-head a:hover{color:var(--red);}

/* card grids */
.card-row{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.card-row::-webkit-scrollbar{display:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;}
.track-card{
  width:170px;flex-shrink:0;background:var(--charcoal);border-radius:var(--radius-lg);
  padding:10px;transition:background .15s,transform .15s;border:1px solid transparent;
}
.track-card:hover{background:var(--surface);transform:translateY(-2px);}
.art-wrap{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;margin-bottom:10px;background:var(--surface-2);}
.art-wrap img{width:100%;height:100%;object-fit:cover;}
.play-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;
}
.track-card:hover .play-overlay{opacity:1;}
.play-fab{
  width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px var(--red-glow);
}
.play-fab svg{width:17px;height:17px;}
.tc-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tc-sub{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.tc-sub a:hover{color:var(--red);}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--text-dim);font-weight:600;}
.pill.active,.pill:hover{color:var(--text);border-color:var(--red-dim);}
.btn{padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--text);display:inline-flex;align-items:center;gap:8px;}
.btn:hover{border-color:var(--text-faint);}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn.primary:hover{background:#e01c39;}
.btn.ghost{background:none;border:1px solid var(--line);}
.btn.danger{background:none;border:1px solid var(--red-dim);color:#ff8b98;}
.btn svg{width:15px;height:15px;}
.btn.small{padding:6px 12px;font-size:12.5px;}
.btn.active{color:var(--red);border-color:var(--red-dim);}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-dim);text-align:center;gap:8px;}
.empty-state .em-ic{width:48px;height:48px;color:var(--text-faint);margin-bottom:8px;}
.empty-state h3{color:var(--text);font-size:16px;}
.empty-state p{font-size:13px;max-width:320px;}

.skeleton{background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.toast-stack{position:fixed;bottom:calc(var(--player-h) + 20px);right:24px;display:flex;flex-direction:column;gap:10px;z-index:200;}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--red);padding:12px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastIn .2s ease;min-width:220px;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.modal{background:var(--charcoal);border:1px solid var(--line);border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;}
.modal.wide{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h3{font-size:17px;}
.close-x{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.close-x:hover{background:var(--surface);color:var(--text);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input,.field textarea,.field select{width:100%;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}

/* Player bar */
#player-bar{
  position:fixed;left:0;right:0;bottom:0;height:var(--player-h);
  background:var(--charcoal);border-top:1px solid var(--line);
  display:flex;align-items:center;padding:0 18px;gap:18px;z-index:150;
}
.pb-track{display:flex;align-items:center;gap:12px;width:230px;flex-shrink:0;min-width:0;}
.pb-art{width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.pb-art img{width:100%;height:100%;object-fit:cover;}
.pb-meta{min-width:0;}
.pb-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pb-artist{font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pb-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:640px;margin:0 auto;}
.pb-controls{display:flex;align-items:center;gap:16px;}
.pb-controls button{color:var(--text-dim);}
.pb-controls button:hover{color:var(--text);}
.pb-controls svg{width:17px;height:17px;}
.pb-play{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff !important;display:flex;align-items:center;justify-content:center;}
.pb-play svg{width:15px;height:15px;}
.pb-seek-row{display:flex;align-items:center;gap:8px;width:100%;}
.pb-time{font-size:11px;color:var(--text-faint);width:36px;flex-shrink:0;text-align:center;font-variant-numeric:tabular-nums;}
.pb-wave{flex:1;height:32px;position:relative;cursor:pointer;}
.pb-wave canvas{width:100%;height:100%;display:block;}
.pb-right{width:230px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;}
.pb-right button{color:var(--text-dim);}
.pb-right button:hover,.pb-right button.active{color:var(--red);}
.pb-right svg{width:16px;height:16px;}
.vol-row{display:flex;align-items:center;gap:6px;width:88px;}
.range{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--surface-2);flex:1;outline:none;}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--red);cursor:pointer;}

/* waveform (large, track page) */
.big-wave{width:100%;height:110px;position:relative;cursor:pointer;background:var(--charcoal);border-radius:var(--radius);}
.big-wave canvas{width:100%;height:100%;display:block;}

/* Landing */
.landing-hero{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(255,35,64,.16),transparent),var(--black);}
.landing-nav{display:flex;align-items:center;padding:22px 40px;}
.landing-nav .brand{margin-right:auto;}
.landing-hero-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px 60px;position:relative;}
.hero-bars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:3px;opacity:.35;pointer-events:none;overflow:hidden;}
.hero-bars i{width:5px;background:linear-gradient(to top,var(--red),transparent);border-radius:2px;animation:bar 1.6s ease-in-out infinite;}
@keyframes bar{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.landing-hero-body h1{font-size:clamp(38px,6vw,72px);letter-spacing:-1px;max-width:900px;position:relative;z-index:1;}
.landing-hero-body h1 span{color:var(--red);}
.landing-hero-body p{color:var(--text-dim);font-size:16px;max-width:520px;margin:18px 0 30px;position:relative;z-index:1;}
.discord-btn{
  display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;
  padding:15px 30px;border-radius:10px;font-weight:700;font-size:15px;box-shadow:0 10px 30px var(--red-glow);
  position:relative;z-index:1;
}
.discord-btn:hover{background:#e01c39;transform:translateY(-1px);}
.discord-btn svg{width:20px;height:20px;}
.landing-section{padding:70px 40px;max-width:1200px;margin:0 auto;width:100%;}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;}
.feature-card{background:var(--charcoal);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;}
.feature-card .f-ic{width:34px;height:34px;color:var(--red);margin-bottom:14px;}
.feature-card h3{font-size:15.5px;margin-bottom:6px;}
.feature-card p{font-size:13px;color:var(--text-dim);line-height:1.5;}

/* auth modal */
.auth-modal{max-width:380px;text-align:center;padding:32px 28px;}
.auth-modal .brand-mark{margin:0 auto 16px;}
.auth-modal h3{font-size:19px;margin-bottom:6px;}
.auth-modal p{font-size:13px;color:var(--text-dim);margin-bottom:22px;}
.auth-note{margin-top:16px;font-size:11px;color:var(--text-faint);line-height:1.5;}

/* profile */
.profile-banner{height:220px;border-radius:var(--radius-lg);position:relative;overflow:hidden;margin-bottom:-56px;background:var(--surface-2);}
.profile-banner img{width:100%;height:100%;object-fit:cover;}
.profile-head{display:flex;align-items:flex-end;gap:18px;padding:0 24px;position:relative;z-index:1;}
.profile-avatar{width:112px;height:112px;border-radius:50%;border:5px solid var(--black);overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-info{flex:1;padding-bottom:10px;min-width:0;}
.profile-info h1{font-size:24px;}
.profile-uname{color:var(--text-dim);font-size:13px;margin-top:2px;}
.profile-actions{padding-bottom:10px;display:flex;gap:10px;}
.profile-stats{display:flex;gap:22px;margin:18px 24px 8px;font-size:13px;color:var(--text-dim);}
.profile-stats b{color:var(--text);}
.profile-bio{margin:14px 24px;font-size:13.5px;color:var(--text-dim);max-width:640px;line-height:1.6;}
.profile-tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 24px 20px;}
.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 24px;margin-bottom:20px;}
.tab-item{padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;}
.tab-item.active{color:var(--text);border-color:var(--red);}
.tab-item:hover{color:var(--text);}

/* track page */
.track-hero{display:flex;gap:24px;margin-bottom:24px;}
.track-hero-art{width:220px;height:220px;border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.track-hero-art img{width:100%;height:100%;object-fit:cover;}
.track-hero-info{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0;}
.track-hero-info .genre-pill{width:fit-content;margin-bottom:10px;}
.track-hero-info h1{font-size:28px;margin-bottom:6px;}
.track-hero-artist{font-size:14px;color:var(--text-dim);margin-bottom:14px;}
.track-hero-artist a:hover{color:var(--red);}
.track-actions{display:flex;gap:10px;flex-wrap:wrap;}
.track-desc{margin:20px 0;font-size:13.5px;color:var(--text-dim);line-height:1.7;max-width:760px;white-space:pre-wrap;}

.comment-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.comment-row:last-child{border:none;}
.c-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.c-avatar img{width:100%;height:100%;object-fit:cover;}
.c-body{flex:1;min-width:0;}
.c-head{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:3px;flex-wrap:wrap;}
.c-head b{font-weight:600;}
.c-time-tag{background:var(--surface-2);color:var(--red);font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600;}
.c-time{color:var(--text-faint);font-size:11.5px;}
.c-text{font-size:13.5px;color:var(--text-dim);line-height:1.5;}
.c-actions{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--text-faint);}
.c-actions button:hover{color:var(--red);}
.comment-input-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px;}
.comment-input-row textarea{flex:1;resize:none;min-height:44px;}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px;}
.stat-card{background:var(--charcoal);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.stat-card .sc-num{font-family:var(--font-display);font-size:24px;font-weight:700;}
.stat-card .sc-label{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px;}
.chart-bars div{flex:1;background:linear-gradient(to top,var(--red),var(--red-dim));border-radius:3px 3px 0 0;min-height:2px;}

table.mgmt{width:100%;border-collapse:collapse;font-size:13px;}
table.mgmt th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line);}
table.mgmt td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.mgmt tr:hover td{background:var(--surface);}
.mini-row{display:flex;align-items:center;gap:10px;}
.mini-art{width:36px;height:36px;border-radius:6px;overflow:hidden;background:var(--surface-2);flex-shrink:0;}
.mini-art img{width:100%;height:100%;object-fit:cover;}

/* settings */
.settings-layout{display:flex;gap:30px;}
.settings-nav{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;}
.settings-nav button{text-align:left;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--text-dim);font-weight:500;}
.settings-nav button:hover{background:var(--surface);color:var(--text);}
.settings-nav button.active{background:var(--surface);color:var(--text);}
.settings-panel{flex:1;max-width:560px;}
.settings-panel h2{font-size:17px;margin-bottom:4px;}
.settings-panel .panel-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:20px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);}
.toggle-row div span{display:block;font-size:13.5px;font-weight:500;}
.toggle-row div small{color:var(--text-dim);font-size:12px;}
.switch{width:40px;height:22px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex-shrink:0;}
.switch.on{background:var(--red);border-color:var(--red);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;}
.switch.on::after{transform:translateX(18px);}

.color-swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.selected{border-color:#fff;box-shadow:0 0 0 2px var(--black);}

.upload-drop{border:2px dashed var(--line);border-radius:var(--radius-lg);padding:36px 20px;text-align:center;color:var(--text-dim);margin-bottom:18px;transition:border-color .15s,background .15s;}
.upload-drop.drag{border-color:var(--red);background:rgba(255,35,64,.05);}
.upload-drop svg{width:32px;height:32px;color:var(--text-faint);margin-bottom:10px;}
.upload-drop .browse{color:var(--red);font-weight:600;}
.progress-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:10px;}
.progress-bar div{height:100%;background:var(--red);width:0%;transition:width .2s;}

.mobile-nav{display:none;}
.hamburger{display:none;}

/* bottom mobile nav */
@media (max-width:880px){
  :root{--sidebar-w:0px;}
  .sidebar{display:none;}
  .main-col{margin-left:0;}
  .content{padding:16px;}
  .topbar{padding:0 14px;}
  .search-box{max-width:none;}
  .feature-grid{grid-template-columns:1fr;}
  .track-hero{flex-direction:column;}
  .track-hero-art{width:100%;height:auto;aspect-ratio:1;}
  .settings-layout{flex-direction:column;}
  .settings-nav{width:100%;flex-direction:row;overflow-x:auto;}
  #player-bar{height:auto;padding:8px 10px;flex-wrap:wrap;padding-bottom:calc(8px + 58px);}
  .pb-right .vol-row{display:none;}
  .pb-track{width:auto;flex:1;}
  .pb-center{order:3;width:100%;max-width:none;}
  .pb-right{width:auto;}
  #app-root{padding-bottom:150px;}
  .mobile-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;height:58px;background:var(--charcoal);
    border-top:1px solid var(--line);z-index:160;align-items:center;justify-content:space-around;
  }
  .mobile-nav a{color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:600;}
  .mobile-nav a.active{color:var(--red);}
  .mobile-nav svg{width:20px;height:20px;}
  #player-bar{bottom:58px;}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div class="toast-stack" id="toast-stack"></div>
<script src="app.js"></script>
</body>
</html>
